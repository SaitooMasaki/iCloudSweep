<!DOCTYPE html>
<!--
  iCloud Photos UI モック
  ─────────────────────────────────────────────────────────────
  iCloudSweep の content.js が期待するセレクタ群を実装した
  テスト専用フィクスチャページ。Playwright が
  https://www.icloud.com/photos/ をインターセプトして
  このHTMLを返すことで、実際のiCloudにログインせずに
  削除フローをE2Eテストできる。

  動作:
  1. [aria-label="Select"] ボタンでセレクションモードに入る
  2. [aria-label="Select All"] で全写真を選択
  3. 個別写真クリックで選択/解除が可能（お気に入りのdeselect用）
  4. [aria-label="Delete"] ボタンで削除ダイアログ表示
  5. role="dialog" 内の button.destructive で削除実行
  6. 削除後に写真がDOMから消える（次回ループへ）
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photos - iCloud</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f5f5f7; }
    #toolbar { display: flex; gap: 8px; padding: 12px; background: rgba(255,255,255,0.85); }
    #toolbar button { padding: 6px 14px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; font-size: 14px; }
    #photo-grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; }
    figure { width: 120px; height: 120px; background: #ddd; margin: 0; border-radius: 4px; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #555; }
    figure[aria-selected="true"] { outline: 3px solid #007AFF; }
    figure .fav-icon { position: absolute; top: 4px; right: 6px; color: #ff375f; font-size: 16px; }
    #confirm-dialog { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; }
    #confirm-dialog.open { display: flex; }
    #dialog-box { background: #fff; padding: 24px; border-radius: 12px; min-width: 280px; text-align: center; }
    #dialog-box p { margin: 0 0 16px; font-size: 15px; }
    #dialog-box .actions { display: flex; gap: 8px; justify-content: center; }
    #dialog-box button { padding: 8px 20px; border-radius: 8px; border: none; font-size: 14px; cursor: pointer; }
    button.destructive { background: #ff3b30; color: #fff; }
    button.cancel-dialog { background: #e5e5ea; color: #000; }
    #empty-msg { display: none; padding: 40px; text-align: center; color: #888; font-size: 14px; }
  </style>
</head>
<body>

  <!-- Toolbar -->
  <div id="toolbar">
    <button id="btn-select"     aria-label="Select"     title="Select">Select</button>
    <button id="btn-select-all" aria-label="Select All" title="Select All" style="display:none">Select All</button>
    <button id="btn-cancel"     aria-label="Cancel"     title="Cancel"     style="display:none">Cancel</button>
    <button id="btn-delete"     aria-label="Delete"     title="Delete"     style="display:none">Delete</button>
  </div>

  <!-- Photo grid -->
  <div id="photo-grid" role="grid">
    <!-- Photos injected by JS based on window.MOCK_PHOTOS -->
  </div>

  <div id="empty-msg">No photos found.</div>

  <!-- Confirmation dialog -->
  <div id="confirm-dialog" role="dialog" aria-modal="true">
    <div id="dialog-box">
      <p id="dialog-msg">Move photos to Recently Deleted?</p>
      <div class="actions">
        <button id="btn-confirm-delete" class="destructive">Delete</button>
        <button id="btn-cancel-dialog"  class="cancel-dialog">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // ─── Mock data ──────────────────────────────────────────────────────────
    // Playwright injects window.MOCK_PHOTOS before this script runs, or we use defaults.
    const photos = window.MOCK_PHOTOS || [
      { id: 'photo-1', label: 'Photo 1', favorited: false },
      { id: 'photo-2', label: 'Photo 2', favorited: false },
      { id: 'photo-3', label: 'Photo 3', favorited: true  },
      { id: 'photo-4', label: 'Photo 4', favorited: false },
      { id: 'photo-5', label: 'Photo 5', favorited: false },
    ];

    // ─── Build photo grid ────────────────────────────────────────────────────
    const grid = document.getElementById('photo-grid');

    function renderPhotos() {
      grid.innerHTML = '';
      for (const p of photos) {
        if (p._deleted) continue;
        const fig = document.createElement('figure');
        fig.setAttribute('data-asset-guid', p.id);
        fig.textContent = p.label;
        if (p.favorited) {
          const heart = document.createElement('span');
          heart.className = 'fav-icon';
          heart.setAttribute('aria-label', 'Favorited');
          heart.setAttribute('title', 'Favorited');
          heart.textContent = '♥';
          fig.appendChild(heart);
        }
        fig.addEventListener('click', () => toggleSelect(fig));
        grid.appendChild(fig);
      }
      updateEmptyState();
    }

    function updateEmptyState() {
      const visible = grid.querySelectorAll('figure').length;
      document.getElementById('empty-msg').style.display = visible === 0 ? 'block' : 'none';
    }

    renderPhotos();

    // ─── Selection mode ──────────────────────────────────────────────────────
    let selectionMode = false;

    function enterSelectionMode() {
      selectionMode = true;
      document.getElementById('btn-select').style.display = 'none';
      document.getElementById('btn-select-all').style.display = '';
      document.getElementById('btn-cancel').style.display = '';
    }

    function exitSelectionMode() {
      selectionMode = false;
      deselectAll();
      document.getElementById('btn-select').style.display = '';
      document.getElementById('btn-select-all').style.display = 'none';
      document.getElementById('btn-cancel').style.display = 'none';
      document.getElementById('btn-delete').style.display = 'none';
    }

    function toggleSelect(fig) {
      if (!selectionMode) return;
      if (fig.getAttribute('aria-selected') === 'true') {
        fig.removeAttribute('aria-selected');
      } else {
        fig.setAttribute('aria-selected', 'true');
      }
      updateDeleteBtn();
    }

    function deselectAll() {
      grid.querySelectorAll('[aria-selected="true"]').forEach(el => el.removeAttribute('aria-selected'));
    }

    function updateDeleteBtn() {
      const anySelected = grid.querySelectorAll('[aria-selected="true"]').length > 0;
      document.getElementById('btn-delete').style.display = anySelected ? '' : 'none';
    }

    // ─── Event handlers ──────────────────────────────────────────────────────
    document.getElementById('btn-select').addEventListener('click', enterSelectionMode);

    document.getElementById('btn-select-all').addEventListener('click', () => {
      grid.querySelectorAll('figure').forEach(fig => fig.setAttribute('aria-selected', 'true'));
      updateDeleteBtn();
    });

    document.getElementById('btn-cancel').addEventListener('click', exitSelectionMode);

    document.getElementById('btn-delete').addEventListener('click', () => {
      const count = grid.querySelectorAll('[aria-selected="true"]').length;
      document.getElementById('dialog-msg').textContent =
        `Move ${count} photo${count !== 1 ? 's' : ''} to Recently Deleted?`;
      document.getElementById('confirm-dialog').classList.add('open');
    });

    document.getElementById('btn-confirm-delete').addEventListener('click', () => {
      // Remove selected photos from DOM and mark as deleted in data
      grid.querySelectorAll('[aria-selected="true"]').forEach(fig => {
        const id = fig.getAttribute('data-asset-guid');
        const photo = photos.find(p => p.id === id);
        if (photo) photo._deleted = true;
        fig.remove();
      });
      document.getElementById('confirm-dialog').classList.remove('open');
      updateDeleteBtn();
      updateEmptyState();

      // If no photos remain, exit selection mode
      if (grid.querySelectorAll('figure').length === 0) {
        exitSelectionMode();
      }
    });

    document.getElementById('btn-cancel-dialog').addEventListener('click', () => {
      document.getElementById('confirm-dialog').classList.remove('open');
    });
  </script>
</body>
</html>
